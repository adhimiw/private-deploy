name: Hostinger Deploy

on:
  push:
    branches:
      - main2
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install backend dependencies
        run: composer install --working-dir=backend --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Prepare release archive
        run: |
          mkdir -p .release
          tar \
            --exclude-vcs \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./backend/node_modules' \
            --exclude='./storage/config.php' \
            --exclude='./storage/*.sqlite' \
            --exclude='./assets/uploads/*' \
            --exclude='./.agent' \
            --exclude='./.claude' \
            --exclude='./.codebuddy' \
            --exclude='./.codex' \
            --exclude='./.continue' \
            --exclude='./.gemini' \
            --exclude='./.kiro' \
            --exclude='./.opencode' \
            --exclude='./.qoder' \
            --exclude='./.roo' \
            --exclude='./.trae' \
            --exclude='./.windsurf' \
            --exclude='./.codex-live-home.html' \
            -czf .release/release.tar.gz .

      - name: Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: ".release/release.tar.gz,deploy.sh"
          target: "deployments/varman"
          overwrite: true

      - name: Run remote deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            chmod +x "$HOME/deployments/varman/deploy.sh"
            "$HOME/deployments/varman/deploy.sh" "$HOME/deployments/varman/.release/release.tar.gz"
